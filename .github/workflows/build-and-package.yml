name: Build and Publish Packages

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'release/**', 'hotfix/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cmake
      run: brew install cmake
    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cargo/bin/cargo-polylith
          target
        key: cargo-macos-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-macos-
    - name: Install cargo-polylith
      run: cargo install --git https://github.com/johlrogge/metadev --bin cargo-polylith
    - name: Generate profile manifest
      run: cargo polylith profile build dev --no-build
    - name: Build mdma CLI for Apple Silicon
      run: cargo build --release --manifest-path profiles/dev/Cargo.toml --bin mdma
    - uses: actions/upload-artifact@v4
      with:
        name: mdma-cli-macos-arm64
        path: target/release/mdma

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Setup cross-compilation sysroot
      run: devenv shell -- ./scripts/ci/setup-cross-sysroot.sh

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-aarch64-

    - name: Build mdma binary for BDD tests
      run: devenv shell -- cargo polylith cargo --profile dev build --bin mdma

    - name: Unit tests
      run: devenv shell -- cargo polylith cargo --profile dev test

    - name: BDD integration tests
      timeout-minutes: 30
      run: devenv shell -- just bdd

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v16
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - name: Setup cross-compilation sysroot
      run: devenv shell -- ./scripts/ci/setup-cross-sysroot.sh

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-aarch64-

    - uses: actions/cache@v4
      with:
        path: .cross/aarch64-sysroot
        key: sysroot-${{ hashFiles('scripts/ci/setup-cross-sysroot.sh') }}

    - name: Build packages
      run: |
        devenv shell -- just pkg-build-all

    - name: Setup signing key
      env:
        SIGNING_KEY: ${{ secrets.XBPS_SIGNING_KEY }}
      run: |
        if [ -n "$SIGNING_KEY" ]; then
          echo "Setting up RSA signing key for xbps-rindex..."

          # Create .ssh directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key
          echo "$SIGNING_KEY" > ~/.ssh/mdma-signing-key.pem
          chmod 600 ~/.ssh/mdma-signing-key.pem

          echo "✅ Signing key configured"
          echo "HAS_SIGNING_KEY=true" >> $GITHUB_ENV
        else
          echo "⚠️  No XBPS_SIGNING_KEY secret found"
          echo "⚠️  Packages will not be signed (insecure)"
          echo "HAS_SIGNING_KEY=false" >> $GITHUB_ENV
        fi

    - name: Sign packages
      if: env.HAS_SIGNING_KEY == 'true'
      run: |
        devenv shell -- bash -c '
          cd build/repository

          REPOSITORY_DIR="$(pwd)/aarch64"

          echo "Repository directory: ${REPOSITORY_DIR}"
          echo ""

          echo "Creating repository index..."
          XBPS_TARGET_ARCH=aarch64 xbps-rindex -a ${REPOSITORY_DIR}/*.xbps

          echo ""
          echo "Signing repository (embeds public key in metadata)..."
          XBPS_TARGET_ARCH=aarch64 xbps-rindex --sign \
            --signedby "MDMA Package Signing" \
            --privkey ~/.ssh/mdma-signing-key.pem \
            ${REPOSITORY_DIR}

          echo ""
          echo "Signing individual packages..."
          for pkg in ${REPOSITORY_DIR}/*.xbps; do
            echo "  Signing $(basename $pkg)..."
            XBPS_TARGET_ARCH=aarch64 xbps-rindex --privkey ~/.ssh/mdma-signing-key.pem --sign-pkg ${pkg}
          done

          echo ""
          echo "Verifying signatures created:"
          ls -lh ${REPOSITORY_DIR}/*.sig2

          echo ""
          echo "Repository metadata (contains public key):"
          ls -lh ${REPOSITORY_DIR}/*-repodata
        '

    - name: Verify repository
      run: |
        echo "Repository contents:"
        find build/repository -type f

        echo ""
        echo "Package index:"
        ls -lh build/repository/aarch64/aarch64-repodata

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build/repository

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
