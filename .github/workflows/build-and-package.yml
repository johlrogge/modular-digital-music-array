name: Build and Publish Packages

on:
  push:
    branches: [ main, master, develop, 'feature/**', 'release/**', 'hotfix/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-macos-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-macos-

    - name: Build mdma and mdma-tui for Apple Silicon
      run: devenv shell -- cargo polylith cargo --profile dev build --release --bin mdma --bin mdma-tui

    - name: Fix dylib paths for distribution
      run: |
        for BIN in mdma mdma-tui; do
          LIBICONV_NIX=$(otool -L "target/release/$BIN" | awk '/libiconv/{print $1}' | head -1)
          if [ -n "$LIBICONV_NIX" ] && [[ "$LIBICONV_NIX" == /nix/* ]]; then
            echo "Rewriting $LIBICONV_NIX -> /usr/lib/libiconv.2.dylib in $BIN"
            install_name_tool -change "$LIBICONV_NIX" /usr/lib/libiconv.2.dylib "target/release/$BIN"
          fi
        done

    - name: Package release tarball (macOS arm64)
      # Built on every run so branch builds exercise it; only attached to a
      # release on tag pushes (see the `release` job).
      run: |
        # install_name_tool only fixes libiconv; any other /nix dylib would
        # make the binary fail on a plain Mac, so refuse to ship it.
        # (otool -L indents each library with a TAB.)
        if otool -L target/release/mdma target/release/mdma-tui | grep -qE '^[[:space:]]+/nix/'; then
          echo "::error::binary still links a /nix dylib"
          otool -L target/release/mdma target/release/mdma-tui
          exit 1
        fi
        # install_name_tool may invalidate the signature; arm64 needs a valid
        # (ad-hoc) one or the kernel kills the binary.
        codesign --force --sign - target/release/mdma target/release/mdma-tui
        mkdir -p dist
        tar -C target/release -czf dist/mdma-macos-arm64.tar.gz mdma mdma-tui
        tar -tzf dist/mdma-macos-arm64.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: release-macos-arm64
        path: dist/mdma-macos-arm64.tar.gz

  build-linux-cli:
    # Portable x86_64 Linux CLI: cargo-zigbuild against an old glibc, so the
    # binary uses /lib64/ld-linux-x86-64.so.2 instead of the /nix/store loader.
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-linux-x86_64-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-linux-x86_64-

    - name: Build mdma and mdma-tui (x86_64, glibc 2.31)
      run: devenv shell -- just cli-linux-portable 2.31

    # Everything below runs on the plain runner, outside devenv/nix.
    - name: Verify the binaries are not tied to /nix
      run: bash ./scripts/ci/verify-linux-portable.sh target/x86_64-unknown-linux-gnu/release/mdma target/x86_64-unknown-linux-gnu/release/mdma-tui

    - name: Run mdma --version on the plain runner
      run: target/x86_64-unknown-linux-gnu/release/mdma --version

    - name: Check the version matches the tag (tag runs only)
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        TAG: ${{ github.ref_name }}
      run: |
        got="$(target/x86_64-unknown-linux-gnu/release/mdma --version)"
        want="Version: ${TAG#v}"
        echo "got:  $got"
        echo "want: $want"
        [ "$got" = "$want" ]

    - name: Run mdma and mdma-tui on an old glibc (Debian 11, glibc 2.31)
      run: |
        docker run --rm -v "$PWD/target/x86_64-unknown-linux-gnu/release:/w:ro" \
          debian:11-slim sh -c '/w/mdma --version && /w/mdma-tui --help >/dev/null'

    - name: Package release tarball (linux x86_64)
      run: |
        mkdir -p dist
        tar -C target/x86_64-unknown-linux-gnu/release -czf dist/mdma-linux-x86_64.tar.gz mdma mdma-tui
        tar -tzf dist/mdma-linux-x86_64.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: release-linux-x86_64
        path: dist/mdma-linux-x86_64.tar.gz

  release:
    # Runs only for a v* tag push (git flow release/hotfix finish creates
    # vX.Y.Z). The tag push is its own workflow run, independent of the
    # master push run, so the order in which git-flow's refs arrive does not
    # matter and nothing has to detect a tag from the master run.
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux-cli, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: dist
        merge-multiple: true

    - name: Generate SHA256SUMS
      working-directory: dist
      shell: bash
      run: |
        ls -l
        sha256sum mdma-macos-arm64.tar.gz mdma-linux-x86_64.tar.gz | tee SHA256SUMS
        sha256sum -c SHA256SUMS

    - name: Create or update the release
      # A new release is created together with its assets in one call, so
      # `releases/latest/download` never sees an empty release. Re-running
      # the job against an existing release replaces the assets (--clobber).
      shell: bash
      run: |
        files=(dist/mdma-macos-arm64.tar.gz dist/mdma-linux-x86_64.tar.gz dist/SHA256SUMS)
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" --clobber "${files[@]}"
        else
          flags=()
          # vX.Y.Z-rc.1 and the like are prereleases, not "latest".
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes "${flags[@]}" "${files[@]}"
        fi

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Free disk space
      # Nix + devenv + sysroot + cargo target/ overflow the ~14 GB free on the
      # hosted runner (#83). Remove preinstalled toolchains this project never uses.
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune --all --force || true
        df -h /

    - uses: actions/checkout@v4

    - name: Verify package sources (void-packages/srcpkgs)
      # Static and fast: needs only bash/awk/sh, no build. Covers PRs.
      run: bash ./scripts/ci/verify-packages.sh --static

    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - uses: actions/cache@v4
      with:
        path: .cross/aarch64-sysroot
        key: sysroot-${{ hashFiles('scripts/ci/setup-cross-sysroot.sh') }}

    - name: Setup cross-compilation sysroot
      run: devenv shell -- ./scripts/ci/setup-cross-sysroot.sh

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-aarch64-

    - name: Build mdma binary for BDD tests
      run: devenv shell -- cargo polylith cargo --profile dev build --bin mdma

    - name: Unit tests
      # dj-workspace and bevy-app are laptop-only GUI crates; Vulkan/Wayland/libudev are
      # intentionally absent from the CI shell (see devenv.nix isCI gate).
      run: devenv shell -- cargo polylith cargo --profile dev test --workspace --exclude dj-workspace --exclude bevy-app

    - name: BDD integration tests
      timeout-minutes: 30
      run: devenv shell -- just bdd

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Free disk space
      # Same as the test job (#83): keep the publish job from hitting ENOSPC.
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        sudo docker image prune --all --force || true
        df -h /

    - uses: actions/checkout@v4

    - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
    - uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
      with:
        name: devenv
    - run: nix profile install nixpkgs#devenv

    - uses: actions/cache@v4
      with:
        path: .cross/aarch64-sysroot
        key: sysroot-${{ hashFiles('scripts/ci/setup-cross-sysroot.sh') }}

    - name: Setup cross-compilation sysroot
      run: devenv shell -- ./scripts/ci/setup-cross-sysroot.sh

    - uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: cargo-aarch64-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-aarch64-

    - name: Check working tree before build (informational)
      # TODO: make fatal once a master run is clean (see the script).
      run: bash ./scripts/ci/check-clean-tree.sh "before the build"

    - name: Build packages
      run: |
        devenv shell -- just pkg-build-all

    - name: Check working tree after build (informational)
      # A dirty tree makes the beacon build report `-dirty`. Prints status and
      # diff stat and warns; compare with the step before the build.
      # TODO: make fatal once a master run is clean (see the script).
      run: bash ./scripts/ci/check-clean-tree.sh "after the build"

    - name: Verify packages against void-packages/srcpkgs
      run: |
        devenv shell -- just pkg-verify --require-all

    - name: Setup signing key
      env:
        SIGNING_KEY: ${{ secrets.XBPS_SIGNING_KEY }}
      run: |
        if [ -n "$SIGNING_KEY" ]; then
          echo "Setting up RSA signing key for xbps-rindex..."

          # Create .ssh directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key
          echo "$SIGNING_KEY" > ~/.ssh/mdma-signing-key.pem
          chmod 600 ~/.ssh/mdma-signing-key.pem

          echo "✅ Signing key configured"
          echo "HAS_SIGNING_KEY=true" >> $GITHUB_ENV
        else
          echo "⚠️  No XBPS_SIGNING_KEY secret found"
          echo "⚠️  Packages will not be signed (insecure)"
          echo "HAS_SIGNING_KEY=false" >> $GITHUB_ENV
        fi

    - name: Sign packages
      if: env.HAS_SIGNING_KEY == 'true'
      run: |
        devenv shell -- bash -c '
          cd build/repository

          REPOSITORY_DIR="$(pwd)/aarch64"

          echo "Repository directory: ${REPOSITORY_DIR}"
          echo ""

          echo "Creating repository index..."
          XBPS_TARGET_ARCH=aarch64 xbps-rindex -a ${REPOSITORY_DIR}/*.xbps

          echo ""
          echo "Signing repository (embeds public key in metadata)..."
          XBPS_TARGET_ARCH=aarch64 xbps-rindex --sign \
            --signedby "MDMA Package Signing" \
            --privkey ~/.ssh/mdma-signing-key.pem \
            ${REPOSITORY_DIR}

          echo ""
          echo "Signing individual packages..."
          for pkg in ${REPOSITORY_DIR}/*.xbps; do
            echo "  Signing $(basename $pkg)..."
            XBPS_TARGET_ARCH=aarch64 xbps-rindex --privkey ~/.ssh/mdma-signing-key.pem --sign-pkg ${pkg}
          done

          echo ""
          echo "Verifying signatures created:"
          ls -lh ${REPOSITORY_DIR}/*.sig2

          echo ""
          echo "Repository metadata (contains public key):"
          ls -lh ${REPOSITORY_DIR}/*-repodata
        '

    - name: Verify repository
      run: |
        echo "Repository contents:"
        find build/repository -type f

        echo ""
        echo "Package index:"
        ls -lh build/repository/aarch64/aarch64-repodata

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./build/repository

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
