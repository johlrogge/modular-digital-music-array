[package]
name = "mdma-cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mdma"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true, features = ["derive"] }
color-eyre = { workspace = true }

# IPC (via shared clients)
library-ipc-client = { path = "../../components/library_ipc_client" }
bandcamp-ipc-client = { path = "../../components/bandcamp_ipc_client" }

# Output formatting
tabled = "0.15"
