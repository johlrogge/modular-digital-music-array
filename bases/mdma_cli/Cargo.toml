[package]
name = "mdma-cli"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mdma"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true, features = ["derive"] }
color-eyre = { workspace = true }

# IPC (via shared clients)
library-ipc-client = { path = "../../components/library_ipc_client" }
library-search = { path = "../../components/library_search" }
media-client = { path = "../../components/media_client" }
gateway-client = { path = "../../components/gateway_client" }
source-protocol = { path = "../../components/source_protocol" }
nng-transport = { path = "../../components/nng_transport" }

# Serialization
serde_json = { workspace = true }
nng = { workspace = true }

# Output formatting
colored = "2.0"
corsett = { path = "../../../corsett" }
