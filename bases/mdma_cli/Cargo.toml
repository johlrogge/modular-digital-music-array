[package]
name = "mdma-cli"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mdma"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true, features = ["derive"] }
color-eyre = { workspace = true }

# Client abstraction (gateway or direct)
event-protocol = { path = "../../components/event_protocol" }
mdma-client = { path = "../../components/mdma_client" }

# Event subscription
nng = { workspace = true }
nng-transport = { path = "../../components/nng_transport" }
serde_json = { workspace = true }

# IPC (still needed for protocol types re-exported by mdma-client)
library-ipc-client = { path = "../../components/library_ipc_client" }
library-search = { path = "../../components/library_search" }
source-protocol = { path = "../../components/source_protocol" }

# Output formatting
colored = "2.0"
corsett = { path = "../../../corsett" }
terminal_size = "0.4"
