[package]
name = "mdma-cli"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mdma"
path = "src/main.rs"

[dependencies]
# CLI
clap = { workspace = true, features = ["derive"] }
color-eyre = { workspace = true }

# IPC
nng = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Output formatting
tabled = "0.15"
