[package]
name = "mdma-bandcamp"
version = "0.6.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mdma-bandcamp"
path = "src/main.rs"

[dependencies]
# IPC and protocol
bandcamp-api = { path = "../../components/bandcamp_api" }
source-protocol = { path = "../../components/source_protocol" }
library-ipc-client = { path = "../../components/library_ipc_client" }
inbox-utils = { path = "../../components/inbox_utils" }
nng = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-stream = "0.1"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
color-eyre = { workspace = true }
thiserror = { workspace = true }

# CLI
clap = { workspace = true }

# Tracing
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
parking_lot = { workspace = true }
zip = "2"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
