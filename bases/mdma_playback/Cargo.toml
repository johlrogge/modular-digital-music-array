[package]
name = "mdma-playback"
version = "0.6.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mdma-playback"
path = "src/main.rs"

[dependencies]
stream-source-protocol = { path = "../../components/stream_source_protocol" }
media-protocol = { path = "../../components/media_protocol" }
event-protocol = { path = "../../components/event_protocol" }
music-facts = { path = "../../components/music_facts" }
playback-primitives = { path = "../../components/playback_primitives" }
acid-client = { path = "../../components/acid_client", features = ["music"] }
tokio = { workspace = true, features = ["full"] }
color-eyre = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
nng = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3.8"
