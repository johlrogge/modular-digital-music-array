[package]
name = "mdma-tui"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mdma-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
mdma-client = { path = "../../components/mdma_client" }
library-search = { path = "../../components/library_search" }
event-protocol = { path = "../../components/event_protocol" }
nng-transport = { path = "../../components/nng_transport" }
nng = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
color-eyre = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
scopeguard = { workspace = true }
thiserror = { workspace = true }
corsett = { git = "https://github.com/johlrogge/corsett.git" }

[dev-dependencies]
library-ipc-protocol = { path = "../../components/library_ipc_protocol" }
music-primitives = { path = "../../components/music_primitives" }
