[package]
name = "mdma-console"
version = "0.3.2"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["process"] }

# Audio export
audio-transcoder = { path = "../../components/audio_transcoder" }
tempfile = "3"
color-eyre = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
nng = { workspace = true }
async-stream = { workspace = true }

# Web framework
axum = { workspace = true, features = ["macros", "multipart"] }
inbox-utils = { path = "../../components/inbox_utils" }
askama = { workspace = true }
tower-http = { workspace = true }

# IPC clients
library-ipc-client = { path = "../../components/library_ipc_client" }
gateway-client = { path = "../../components/gateway_client" }
source-protocol = { path = "../../components/source_protocol" }
event-protocol = { path = "../../components/event_protocol" }
nng-transport = { path = "../../components/nng_transport" }
media-protocol = { path = "../../components/media_protocol" }
library-search = { path = "../../components/library_search" }
bandcamp-api = { path = "../../components/bandcamp_api" }

# CLI and logging
clap = { workspace = true, features = ["derive"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
rstest = { workspace = true }
