[workspace]
schema_version = 1

[workspace.package]
version = "0.11.1"
edition = "2021"
authors = ["MDMA Development Team"]
license = "MIT"
repository = "https://github.com/your-org/mdma"

[libraries]
askama = "0.12"
assert_matches = "1.5"
async-stream = "0.3"
axum = { version = "0.7", features = ["multipart"] }
chrono = "0.4"
clap = { version="4.5", features = ["derive", "env"] }
clap_complete = "4"
color-eyre = "0.6"
corsett = { git = "https://github.com/johlrogge/corsett.git", rev = "bf16c1aa2e8d6ba1f833e33009f2deecadc3ee26" }
futures = "0.3"
lofty = "0.18"
nng = "1.0"
parking_lot = "0.12"
pretty_assertions = "1"
proptest = "1"
rstest = "0.26"
scopeguard = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
stainless-facts = { git = "https://github.com/johlrogge/stainless_facts", rev = "2aa820a808fd5345a1bd59c11d90969bfa84b285" }
tempfile = "3"
thiserror = "1.0"
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2"

[profiles]
dev = "profiles/dev.profile"
production = "profiles/production.profile"
