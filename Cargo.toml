# Root Cargo.toml with beacon added
[workspace]
members = [
    # Components (bricks)
    "components/date_expression",
    "components/bandcamp_api",
    "components/audio_metadata",
    "components/library_ipc_client",
    "components/library_ipc_protocol",
    "components/media_client",
    "components/media_protocol",
    "components/music_facts",
    "components/music_primitives",
    "components/playback_engine",
    "components/playback_primitives",
    "components/time_primitives",
    "components/storage_primitives",
    "components/event_protocol",
    "components/nng_transport",
    "components/library_search",
    "components/source_protocol",
    "components/gateway_protocol",
    "components/gateway_client",
    "components/mdma_client",
    "components/audio_transcoder",
    "components/inbox_utils",
    "components/library_service",
    "components/acid_protocol",
    "components/acid_client",
    "components/stream_source_protocol",
    # Bases (entry points)
    "bases/mdma_playback",
    "bases/beacon",
    "bases/mdma_console",
    "bases/mdma_library",
    "bases/mdma_cli",
    "bases/mdma_bandcamp",
    "bases/mdma_gateway",
    "bases/mdma_acid",
    # Tests
    "tests/bdd",
]
default-members = [
    "components/*",
    "bases/beacon",
    "bases/mdma_bandcamp",
    "bases/mdma_cli",
    "bases/mdma_console",
    "bases/mdma_acid",
    "bases/mdma_gateway",
    "bases/mdma_library",
    "bases/mdma_playback",
]
resolver = "2"

[workspace.package]
version = "0.6.2"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[workspace.dependencies]
askama = "0.12"
assert_matches = "1.5"
async-stream = "0.3"
axum = "0.7"
chrono = "0.4"
clap = { version="4.5", features = ["derive", "env"] }
clap_complete = "4"
color-eyre = "0.6"
futures = "0.3"
lofty = "0.18"
nng = "1.0"
parking_lot = "0.12"
pretty_assertions = "1"
proptest = "1"
rstest = "0.26"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
tokio-util = "0.7"
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
