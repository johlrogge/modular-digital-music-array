# Root Cargo.toml with beacon added
[workspace]
members = [
    # Components (bricks)
    "components/clock",
    "components/flac_metadata",  
    "components/media_client",
    "components/media_downloader",
    "components/media_protocol",
    "components/music_facts",
    "components/music_primitives",
    "components/playback_engine",
    "components/playback_primitives",
    "components/time_primitives",
    "components/storage_primitives",
    "components/audio_fingerprint",
    # Bases (entry points)
    "bases/download_cli",
    "bases/media_ctl",
    "bases/playback_server",
    "bases/library_crawler",
    "bases/beacon",
    "bases/mdma_console",
    "bases/mdma_library",
    "bases/mdma_cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[workspace.dependencies]
askama = "0.12"
assert_matches = "1.5"
async-stream = "0.3"
axum = "0.7"
chrono = "0.4"
clap = { version="4.5", features = ["derive"] }
color-eyre = "0.6"
futures = "0.3"
lofty = "0.18"
nng = "1.0"
parking_lot = "0.12"
rstest = "0.26"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
tokio-util = "0.7"
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
