[workspace]
members = [
    # Components (bricks)
    "components/date_expression",
    "components/bandcamp_api",
    "components/audio_metadata",
    "components/library_ipc_client",
    "components/library_ipc_protocol",
    "components/media_client",
    "components/media_protocol",
    "components/music_facts",
    "components/music_primitives",
    "components/audio_types",
    "components/audio_decoder",
    "components/audio_output",
    "components/audio_resampler",
    "components/playback_engine",
    "components/playback_primitives",
    "components/storage_primitives",
    "components/event_protocol",
    "components/nng_transport",
    "components/library_search",
    "components/source_protocol",
    "components/gateway_protocol",
    "components/gateway_client",
    "components/mdma_client",
    "components/audio_transcoder",
    "components/inbox_utils",
    "components/library_service",
    "components/library_service_stub",
    "components/library_ingestion",
    "components/acid_protocol",
    "components/acid_client",
    "components/fact_store_memory",
    "components/fact_store_file",
    "components/acid_service",
    "components/stream_source_protocol",
    # Bases (entry points)
    "bases/service",
    "bases/http_server",
    "bases/tui",
    "bases/client",
    "bases/bdd-runner",
    # Projects
    "projects/mdma-acid",
    "projects/mdma-audio",
    "projects/mdma-bandcamp",
    "projects/mdma-console",
    "projects/mdma-gateway",
    "projects/mdma-library",
    "projects/mdma-playback",
    "projects/mdma-beacon",
    "projects/mdma-cli",
    "projects/mdma-tui",
    "projects/bdd",
]
resolver = "2"

[workspace.package]
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[workspace.dependencies]
askama = "0.12"
assert_matches = "1.5"
async-stream = "0.3"
axum = "0.7"
chrono = "0.4"
clap = { version="4.5", features = ["derive", "env"] }
clap_complete = "4"
color-eyre = "0.6"
futures = "0.3"
lofty = "0.18"
nng = "1.0"
parking_lot = "0.12"
pretty_assertions = "1"
proptest = "1"
rstest = "0.26"
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
scopeguard = "1"
thiserror = "1.0"
tokio-util = "0.7"
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
service = { path = "bases/service" }
tempfile = "3"
tokio-stream = "0.1"
zip = "2"
corsett = { git = "https://github.com/johlrogge/corsett.git", rev = "bf16c1aa2e8d6ba1f833e33009f2deecadc3ee26" }
stainless-facts = { git = "https://github.com/johlrogge/stainless_facts", rev = "2aa820a808fd5345a1bd59c11d90969bfa84b285" }
# Dev/test default. Production builds use fact_store_file via profiles/production.profile.
fact-store = { path = "components/fact_store_memory" }
acid-service = { path = "components/acid_service" }

[profile.release]
strip = true
