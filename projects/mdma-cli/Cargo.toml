[package]
name = "mdma-cli"
version.workspace = true
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma"
path = "src/main.rs"

[dependencies]
client = { path = "../../bases/client" }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4"
color-eyre = "0.6"
event-protocol = { path = "../../components/event_protocol" }
inbox-utils = { path = "../../components/inbox_utils" }
mdma-client = { path = "../../components/mdma_client" }
tempfile = "3"
nng = "1.0"
nng-transport = { path = "../../components/nng_transport" }
serde_json = "1.0"
audio-transcoder = { path = "../../components/audio_transcoder" }
library-ipc-client = { path = "../../components/library_ipc_client" }
library-search = { path = "../../components/library_search" }
source-protocol = { path = "../../components/source_protocol" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rekordbox-xml = { path = "../../components/rekordbox_xml" }
track-matcher = { path = "../../components/track_matcher" }
music-facts = { workspace = true }
chrono = { workspace = true }
dirs = "6"
colored = "2.0"
corsett = { git = "https://github.com/johlrogge/corsett.git", rev = "bf16c1aa2e8d6ba1f833e33009f2deecadc3ee26" }
terminal_size = "0.4"

[dev-dependencies]
pretty_assertions = "1"
