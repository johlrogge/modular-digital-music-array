[workspace]
resolver = "2"
# This is a standalone project workspace (Polylith projects/ layout).
# Dependencies use explicit versions — no workspace = true inheritance.

[package]
name = "mdma-acid"
version = "0.6.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma-acid"
path = "src/main.rs"

[dependencies]
# Local — path references relative to this project
service = { path = "../../bases/service" }
acid-protocol = { path = "../../components/acid_protocol" }
event-protocol = { path = "../../components/event_protocol" }

# External — keep versions in sync with root Cargo.toml [workspace.dependencies]
stainless-facts = { git = "https://github.com/johlrogge/stainless_facts", rev = "2aa820a808fd5345a1bd59c11d90969bfa84b285" }
nng = "1.0"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"
thiserror = "1.0"
chrono = "0.4"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
