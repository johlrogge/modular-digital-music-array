[workspace]
resolver = "2"
# This is a standalone project workspace (Polylith projects/ layout).
# Dependencies use explicit versions — no workspace = true inheritance.

[workspace.dependencies]
# fact-store resolves to the file-backed implementation for production.
# The package is renamed so the acid-service crate can find it as "fact-store".
fact-store = { package = "fact-store-file", path = "../../components/fact_store_file" }
acid-service = { path = "../../components/acid_service" }
service = { path = "../../bases/service" }

[package]
name = "mdma-acid"
version = "0.6.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/johlrogge/modular-digital-music-array"
license = "MIT"

[[bin]]
name = "mdma-acid"
path = "src/main.rs"

[dependencies]
# Local — path references relative to this project
acid-service = { workspace = true }
service = { workspace = true }

# External — keep versions in sync with root Cargo.toml [workspace.dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
