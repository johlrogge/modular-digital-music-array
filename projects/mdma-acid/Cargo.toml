[package]
name = "mdma-acid"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma-acid"
path = "src/main.rs"

[dependencies]
acid-service = { workspace = true }
service = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
