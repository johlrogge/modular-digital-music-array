[workspace]
resolver = "2"
# Standalone project workspace (Polylith projects/ layout).
# Dependencies use explicit versions — no workspace = true inheritance.

[package]
name = "mdma-audio"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "mdma-audio"
path = "src/main.rs"

[dependencies]
# Local — path references relative to this project
stream-source-protocol = { path = "../../components/stream_source_protocol" }
playback-engine = { path = "../../components/playback_engine" }
library-ipc-client = { path = "../../components/library_ipc_client" }
music-primitives = { path = "../../components/music_primitives" }
playback-primitives = { path = "../../components/playback_primitives" }
service = { path = "../../bases/service" }

# External — keep versions in sync with root Cargo.toml [workspace.dependencies]
nng = "1.0"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3.8"
