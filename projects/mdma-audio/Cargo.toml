[package]
name = "mdma-audio"
version.workspace = true
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma-audio"
path = "src/main.rs"

[dependencies]
stream-source-protocol = { path = "../../components/stream_source_protocol" }
playback-engine = { path = "../../components/playback_engine" }
library-ipc-client = { path = "../../components/library_ipc_client" }
music-primitives = { path = "../../components/music_primitives" }
playback-primitives = { path = "../../components/playback_primitives" }
service = { workspace = true }
nng = "1.0"
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.36", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
