[package]
name = "mdma-console"
version.workspace = true
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma-console"
path = "src/main.rs"

[dependencies]
http-server = { path = "../../bases/http_server" }
admin-ipc-protocol = { workspace = true }
audio-metadata = { path = "../../components/audio_metadata" }
audio-transcoder = { path = "../../components/audio_transcoder" }
inbox-utils = { path = "../../components/inbox_utils" }
library-ipc-client = { path = "../../components/library_ipc_client" }
gateway-client = { path = "../../components/gateway_client" }
source-protocol = { path = "../../components/source_protocol" }
event-protocol = { path = "../../components/event_protocol" }
nng-transport = { path = "../../components/nng_transport" }
media-protocol = { path = "../../components/media_protocol" }
library-search = { path = "../../components/library_search" }
bandcamp-api = { path = "../../components/bandcamp_api" }
tokio = { version = "1.36", features = ["full"] }
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
futures = "0.3"
nng = "1.0"
async-stream = "0.3"
axum = { version = "0.7", features = ["multipart"] }
askama = "0.12"
tower-http = { version = "0.5", features = ["fs"] }
clap = { version = "4.5", features = ["derive", "env"] }
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
