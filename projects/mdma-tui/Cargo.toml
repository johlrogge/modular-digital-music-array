[package]
name = "mdma-tui"
version.workspace = true
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma-tui"
path = "src/main.rs"

[dependencies]
client = { path = "../../bases/client" }
ratatui = "0.29"
crossterm = "0.28"
tui-base = { path = "../../bases/tui" }
mdma-client = { path = "../../components/mdma_client" }
library-search = { path = "../../components/library_search" }
event-protocol = { path = "../../components/event_protocol" }
nng-transport = { path = "../../components/nng_transport" }
nng = "1.0"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
corsett = { git = "https://github.com/johlrogge/corsett.git", rev = "bf16c1aa2e8d6ba1f833e33009f2deecadc3ee26" }

[dev-dependencies]
library-ipc-protocol = { path = "../../components/library_ipc_protocol" }
music-primitives = { path = "../../components/music_primitives" }
