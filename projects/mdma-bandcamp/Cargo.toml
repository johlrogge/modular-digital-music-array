[package]
name = "mdma-bandcamp"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma-bandcamp"
path = "src/main.rs"

[dependencies]
bandcamp-api = { path = "../../components/bandcamp_api" }
source-protocol = { path = "../../components/source_protocol" }
library-ipc-client = { path = "../../components/library_ipc_client" }
inbox-utils = { path = "../../components/inbox_utils" }
service = { workspace = true }
nng = "1.0"
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
color-eyre = "0.6"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
zip = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
