[package]
name = "mdma-playback"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[[bin]]
name = "mdma-playback"
path = "src/main.rs"

[dependencies]
service = { workspace = true }
stream-source-protocol = { path = "../../components/stream_source_protocol" }
media-protocol = { path = "../../components/media_protocol" }
event-protocol = { path = "../../components/event_protocol" }
music-facts = { path = "../../components/music_facts" }
playback-primitives = { path = "../../components/playback_primitives" }
acid-client = { path = "../../components/acid_client", features = ["music"] }
tokio = { version = "1.36", features = ["full"] }
color-eyre = "0.6"
clap = { version = "4.5", features = ["derive", "env"] }
nng = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
