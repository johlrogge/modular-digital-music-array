---
# MDMA Unit Provisioning Playbook
# Usage: ansible-playbook -i "mdma-909-studio.local," provision-mdma.yml

- name: Provision MDMA Unit
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    # Detect role from hostname or override with --extra-vars "mdma_role=909"
    mdma_role: "{{ ansible_hostname.split('-')[1] | default('909') }}"
    
    # NVMe configuration
    primary_nvme: /dev/nvme0n1
    secondary_nvme: /dev/nvme0n2  # Only for role 909
    
    # Partition sizes (in GB, will be converted to percentages)
    root_size: 16
    var_size: 8
    music_size: 400
    # metadata gets remaining space
    
    # Package repository
    mdma_repo_url: "https://yourusername.github.io/mdma/aarch64"
    
    # User configuration
    mdma_user: mdma
    mdma_group: mdma
    
  tasks:
    - name: Display provisioning target
      debug:
        msg: "Provisioning {{ ansible_hostname }} as MDMA-{{ mdma_role }}"
    
    - name: Check if running in beacon mode
      stat:
        path: /run/beacon-hostname
      register: beacon_marker
    
    - name: Verify NVMe drives detected
      command: lsblk -d -n -o NAME,TYPE
      register: block_devices
      changed_when: false
    
    - name: Assert primary NVMe exists
      assert:
        that:
          - "'nvme0n1' in block_devices.stdout"
        fail_msg: "Primary NVMe drive not detected!"
    
    - name: Assert secondary NVMe exists (for role 909)
      assert:
        that:
          - "'nvme0n2' in block_devices.stdout"
        fail_msg: "Secondary NVMe drive not detected (required for MDMA-909)!"
      when: mdma_role == "909"
    
    - name: Partition primary NVMe
      parted:
        device: "{{ primary_nvme }}"
        label: gpt
        state: present
        number: "{{ item.number }}"
        part_start: "{{ item.start }}"
        part_end: "{{ item.end }}"
      loop:
        - { number: 1, start: "0%", end: "3%" }      # root (16GB)
        - { number: 2, start: "3%", end: "5%" }      # var (8GB)
        - { number: 3, start: "5%", end: "83%" }     # music (400GB)
        - { number: 4, start: "83%", end: "100%" }   # metadata (remaining)
    
    - name: Format primary NVMe partitions
      filesystem:
        fstype: ext4
        dev: "{{ primary_nvme }}p{{ item.number }}"
        opts: -L {{ item.label }}
      loop:
        - { number: 1, label: "mdma-root" }
        - { number: 2, label: "mdma-var" }
        - { number: 3, label: "mdma-music" }
        - { number: 4, label: "mdma-metadata" }
    
    - name: Partition secondary NVMe (909 only)
      parted:
        device: "{{ secondary_nvme }}"
        label: gpt
        state: present
        number: 1
        part_start: "0%"
        part_end: "100%"
      when: mdma_role == "909"
    
    - name: Format secondary NVMe (909 only)
      filesystem:
        fstype: ext4
        dev: "{{ secondary_nvme }}p1"
        opts: -L mdma-cdj-export
      when: mdma_role == "909"
    
    - name: Create temporary mount point
      file:
        path: /mnt/new-root
        state: directory
    
    - name: Mount new root filesystem
      mount:
        path: /mnt/new-root
        src: "{{ primary_nvme }}p1"
        fstype: ext4
        state: mounted
    
    - name: Create mountpoint directories
      file:
        path: "/mnt/new-root/{{ item }}"
        state: directory
      loop:
        - var
        - music
        - metadata
        - boot
    
    - name: Mount other partitions
      mount:
        path: "/mnt/new-root/{{ item.path }}"
        src: "{{ item.src }}"
        fstype: "{{ item.fstype }}"
        state: mounted
      loop:
        - { path: "var", src: "{{ primary_nvme }}p2", fstype: "ext4" }
        - { path: "music", src: "{{ primary_nvme }}p3", fstype: "ext4" }
        - { path: "metadata", src: "{{ primary_nvme }}p4", fstype: "ext4" }
        - { path: "boot", src: "/dev/mmcblk0p1", fstype: "vfat" }
    
    - name: Mount CDJ export (909 only)
      file:
        path: /mnt/new-root/cdj-export
        state: directory
      when: mdma_role == "909"
    
    - name: Mount CDJ export partition (909 only)
      mount:
        path: /mnt/new-root/cdj-export
        src: "{{ secondary_nvme }}p1"
        fstype: ext4
        state: mounted
      when: mdma_role == "909"
    
    - name: Install base Void Linux system
      command: >
        xbps-install -S -y
        -R https://repo-default.voidlinux.org/current/aarch64
        -r /mnt/new-root
        base-system void-repo-nonfree
      args:
        creates: /mnt/new-root/usr/bin/xbps-install
    
    - name: Configure fstab
      copy:
        dest: /mnt/new-root/etc/fstab
        content: |
          # MDMA-{{ mdma_role }} fstab
          LABEL=mdma-root      /           ext4  defaults              0 1
          LABEL=mdma-var       /var        ext4  defaults              0 2
          LABEL=mdma-music     /music      ext4  defaults,noatime      0 2
          LABEL=mdma-metadata  /metadata   ext4  defaults,noatime      0 2
          /dev/mmcblk0p1       /boot       vfat  defaults              0 2
          {% if mdma_role == "909" %}
          LABEL=mdma-cdj-export /cdj-export ext4  defaults,noatime      0 2
          {% endif %}
    
    - name: Install system packages
      command: >
        xbps-install -S -y -r /mnt/new-root
        avahi-daemon nss-mdns
        alsa-utils alsa-lib
        runit-void-apparmor
        {% if mdma_role == "909" %}nfs-utils{% endif %}
      args:
        creates: /mnt/new-root/usr/bin/avahi-daemon
    
    - name: Configure hostname
      copy:
        dest: /mnt/new-root/etc/hostname
        content: "{{ ansible_hostname }}\n"
    
    - name: Configure Avahi
      copy:
        dest: /mnt/new-root/etc/avahi/avahi-daemon.conf
        content: |
          [server]
          host-name={{ ansible_hostname }}
          use-ipv4=yes
          use-ipv6=no
          enable-dbus=no
          
          [publish]
          publish-addresses=yes
          publish-hinfo=yes
          publish-workstation=yes
    
    - name: Add MDMA package repository
      copy:
        dest: /mnt/new-root/etc/xbps.d/10-mdma-repo.conf
        content: |
          repository={{ mdma_repo_url }}
    
    - name: Install MDMA packages
      command: >
        xbps-install -S -y -r /mnt/new-root
        mdma-{{ mdma_role }}
      # Note: This will fail until packages are published
      # For initial provisioning, may need to skip or manually install
      ignore_errors: yes
    
    - name: Create MDMA user
      command: >
        chroot /mnt/new-root
        useradd -m -s /bin/bash -G audio {{ mdma_user }}
      args:
        creates: /mnt/new-root/home/{{ mdma_user }}
    
    - name: Set directory ownership
      file:
        path: "/mnt/new-root/{{ item }}"
        owner: "{{ mdma_user }}"
        group: "{{ mdma_group }}"
        mode: "0755"
        recurse: no
      loop:
        - music
        - metadata
    
    - name: Set CDJ export ownership (909 only)
      file:
        path: /mnt/new-root/cdj-export
        owner: "{{ mdma_user }}"
        group: "{{ mdma_group }}"
        mode: "0755"
      when: mdma_role == "909"
    
    - name: Configure NFS exports (909 only)
      copy:
        dest: /mnt/new-root/etc/exports
        content: |
          # CDJ export for ProDJ Link
          /cdj-export 192.168.0.0/16(ro,sync,no_subtree_check,insecure)
      when: mdma_role == "909"
    
    - name: Enable NFS services (909 only)
      file:
        src: "/mnt/new-root/etc/sv/{{ item }}"
        dest: "/mnt/new-root/etc/runit/runsvdir/default/{{ item }}"
        state: link
      loop:
        - nfs-server
        - rpcbind
      when: mdma_role == "909"
    
    - name: Generate SSH host keys
      command: ssh-keygen -A -f /mnt/new-root
      args:
        creates: /mnt/new-root/etc/ssh/ssh_host_rsa_key
    
    - name: Copy authorized keys for MDMA user
      copy:
        src: /root/.ssh/authorized_keys
        dest: /mnt/new-root/home/{{ mdma_user }}/.ssh/authorized_keys
        owner: "{{ mdma_user }}"
        group: "{{ mdma_group }}"
        mode: "0600"
        remote_src: yes
    
    - name: Create snapshot directory
      file:
        path: /mnt/new-root/var/lib/mdma/snapshots
        state: directory
        owner: "{{ mdma_user }}"
        group: "{{ mdma_group }}"
        mode: "0755"
    
    - name: Unmount filesystems
      mount:
        path: "{{ item }}"
        state: unmounted
      loop:
        - /mnt/new-root/boot
        - /mnt/new-root/metadata
        - /mnt/new-root/music
        - /mnt/new-root/var
        - /mnt/new-root/cdj-export  # Will fail for non-909, that's ok
        - /mnt/new-root
      ignore_errors: yes
    
    - name: Remove beacon marker
      file:
        path: /run/beacon-hostname
        state: absent
    
    - name: Display completion message
      debug:
        msg: |
          ✅ Provisioning complete!
          
          The unit will now reboot and boot from NVMe.
          Wait 60 seconds after reboot, then verify:
            ssh {{ mdma_user }}@{{ ansible_hostname }}.local 'mdma-health-check'
    
    - name: Reboot into new system
      reboot:
        msg: "Rebooting into NVMe root filesystem"
        reboot_timeout: 300
