[package]
name = "library-service"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.polylith]
interface = "library-service"

[dependencies]
# Workspace dependencies
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }

# Internal components
library-search = { workspace = true }
library-ingestion = { workspace = true }
music-facts = { workspace = true }
music-primitives = { workspace = true }
audio-metadata = { workspace = true }
library-ipc-protocol = { workspace = true }
acid-client = { workspace = true, features = ["music"] }
event-protocol = { workspace = true }

# Fact stream
stainless-facts = { workspace = true }

# IPC
nng = { workspace = true }

# File watching
notify = "6.1"

[dev-dependencies]
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = "3"
acid-service = { workspace = true }
