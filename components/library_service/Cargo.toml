[package]
name = "library-service"
version = "0.2.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }

# Internal components
library-search = { path = "../library_search" }
music-facts = { path = "../music_facts" }
music-primitives = { path = "../music_primitives" }
flac-metadata = { path = "../flac_metadata" }
library-ipc-protocol = { path = "../library_ipc_protocol" }

# Fact stream
stainless-facts = { git = "https://github.com/johlrogge/stainless_facts" }

# Hashing
sha2 = "0.10"
hex = "0.4"

# IPC
nng = { workspace = true }

# File watching
notify = "6.1"

# Path utilities
pathdiff = "0.2"

[dev-dependencies]
rstest = { workspace = true }
tempfile = "3"
