[package]
name = "library-service"
version = "0.4.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata.polylith]
interface = "library-service"

[dependencies]
# Workspace dependencies
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"

# Internal components
library-search = { workspace = true }
library-ingestion = { workspace = true }
music-facts = { workspace = true }
music-primitives = { workspace = true }
audio-metadata = { workspace = true }
library-ipc-protocol = { workspace = true }
acid-client = { workspace = true, features = ["music"] }
event-protocol = { workspace = true }

# Fact stream
stainless-facts = { git = "https://github.com/johlrogge/stainless_facts", rev = "2aa820a808fd5345a1bd59c11d90969bfa84b285" }

# IPC
nng = "1.0"

# File watching
notify = "6.1"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
tempfile = "3"
acid-service = { workspace = true }
