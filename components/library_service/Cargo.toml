[package]
name = "library-service"
version = "0.4.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.polylith]
interface = "library-service"

[dependencies]
# Workspace dependencies
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
thiserror = { workspace = true }

# Internal components
library-search = { path = "../library_search" }
library-ingestion = { path = "../library_ingestion" }
music-facts = { path = "../music_facts" }
music-primitives = { path = "../music_primitives" }
audio-metadata = { path = "../audio_metadata" }
library-ipc-protocol = { path = "../library_ipc_protocol" }
acid-client = { path = "../acid_client", features = ["music"] }
event-protocol = { path = "../event_protocol" }

# Fact stream
stainless-facts = { git = "https://github.com/johlrogge/stainless_facts", rev = "2aa820a808fd5345a1bd59c11d90969bfa84b285" }

# IPC
nng = { workspace = true }

# File watching
notify = "6.1"

[dev-dependencies]
pretty_assertions = { workspace = true }
rstest = { workspace = true }
tempfile = "3"
