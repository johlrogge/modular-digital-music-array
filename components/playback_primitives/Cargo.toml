[package]
name = "playback-primitives"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "playback-primitives"

[dependencies]
thiserror = "1.0"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
music-primitives = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"
assert_matches = "1.5"
serde_json = "1.0"
rstest = "0.26"
