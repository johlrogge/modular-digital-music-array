[package]
name = "audio-decoder"
version = "0.1.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "audio-decoder"

[dependencies]
audio-types = { workspace = true }
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"

symphonia = { version = "0.5", features = ["default", "flac", "mp3"] }

[build-dependencies]
hound = "3.5"
anyhow = "1.0"
symphonia = { version = "0.5", features = ["flac", "mp3"] }

[[bench]]
name = "track_loading"
harness = false

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.5"
