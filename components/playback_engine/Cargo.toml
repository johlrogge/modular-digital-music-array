[package]
name = "playback-engine"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "playback-engine"

[dependencies]
audio-decoder = { workspace = true }
audio-types = { workspace = true }
thiserror = "1.0"
parking_lot = "0.12"
playback-primitives = { workspace = true }
audio-output = { workspace = true }
tracing = "0.1"
ringbuf = "0.3"
audio-resampler = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
hound = "3.5"    # For WAV handling
anyhow = "1.0"

[[bench]]
name = "track_loading"
harness = false

[dev-dependencies]
pretty_assertions = "1"
criterion = "0.5"
tempfile = "3.8"
hound = "3.5"
tracing-subscriber = "0.3"

[[example]]
name = "file_leak_test"
