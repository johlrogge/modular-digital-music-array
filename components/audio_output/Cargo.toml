[package]
name = "audio-output"
version = "0.1.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "audio-output"

[dependencies]
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
ringbuf = "0.3"
pipewire = "0.8"
spa_sys = { package = "libspa-sys", version = "0.8" }
