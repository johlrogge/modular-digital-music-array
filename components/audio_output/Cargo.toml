[package]
name = "audio-output"
version = "0.1.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "audio-output"

[dependencies]
thiserror = "1.0"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
ringbuf = "0.3"
# Feature v0_3_49 gates `Buffer::requested()` (the number of frames PipeWire
# wants this callback), which the output callback uses to size its fill. It
# requires PipeWire headers >= 0.3.49 at build time; the Void sysroot and the
# devenv both provide 1.4.9.
pipewire = { version = "0.8", features = ["v0_3_49"] }
spa_sys = { package = "libspa-sys", version = "0.8" }
