[package]
name = "library-ingestion"
version = "0.1.0"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "library-ingestion"

[dependencies]
thiserror = "1.0"
tracing = "0.1"
chrono = "0.4"

# Internal components
music-facts = { workspace = true }
music-primitives = { workspace = true }
audio-metadata = { workspace = true }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Path utilities
pathdiff = "0.2"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
tempfile = "3"
