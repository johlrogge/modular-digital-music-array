[package]
name = "music-facts"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "music-facts"

[dependencies]
music-primitives = { workspace = true }
playback-primitives = { workspace = true }
storage_primitives = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
chrono = "0.4"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
serde_json = "1.0"
stainless-facts = { git = "https://github.com/johlrogge/stainless_facts", rev = "2aa820a808fd5345a1bd59c11d90969bfa84b285" }
