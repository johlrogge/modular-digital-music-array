[package]
name = "nng-transport"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "nng-transport"

[dependencies]
nng = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
