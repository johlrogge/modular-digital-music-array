[package]
name = "bandcamp-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Bandcamp API client for MDMA"

[package.metadata]

[package.metadata.polylith]
interface = "bandcamp-api"

[dependencies]
# Async HTTP client (using rustls to avoid native openssl dependency)
reqwest = { version = "0.12", default-features = false, features = ["cookies", "stream", "json", "rustls-tls"] }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# HTML parsing
scraper = "0.18"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Date/time
chrono = { workspace = true, features = ["serde"] }

# Error handling
thiserror = { workspace = true }

# Async runtime
tokio = { workspace = true }

# ZIP extraction
zip = "2.1"

# Reuse music primitives
music-facts = { workspace = true }

# Tracing
tracing = { workspace = true }

# Stream utilities
futures-util = "0.3"
tokio-stream = "0.1"
async-stream = { workspace = true }

# URL parsing
url = "2"

[dev-dependencies]
pretty_assertions = { workspace = true }
