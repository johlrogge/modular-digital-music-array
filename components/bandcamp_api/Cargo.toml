[package]
name = "bandcamp-api"
version = "0.2.0"
edition = "2021"
description = "Bandcamp API client for MDMA"
license = "MIT"

[dependencies]
# Async HTTP client (using rustls to avoid native openssl dependency)
reqwest = { version = "0.12", default-features = false, features = ["cookies", "stream", "json", "rustls-tls"] }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# HTML parsing
scraper = "0.18"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"

# Async runtime
tokio = { version = "1", features = ["fs", "io-util"] }

# ZIP extraction
zip = "2.1"

# Reuse music primitives
music-facts = { path = "../music_facts" }

# Tracing
tracing = "0.1"

# Stream utilities
futures-util = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"

# URL parsing
url = "2"

[dev-dependencies]
pretty_assertions = { workspace = true }
