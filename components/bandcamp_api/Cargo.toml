[package]
name = "bandcamp-api"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"
description = "Bandcamp API client for MDMA"

[package.metadata]

[package.metadata.polylith]
interface = "bandcamp-api"

[dependencies]
# Async HTTP client (using rustls to avoid native openssl dependency)
reqwest = { version = "0.12", default-features = false, features = ["cookies", "stream", "json", "rustls-tls"] }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# HTML parsing
scraper = "0.18"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = "0.4"

# Error handling
thiserror = "1.0"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# ZIP extraction
zip = "2.1"

# Reuse music primitives
music-facts = { workspace = true }

# Tracing
tracing = "0.1"

# Stream utilities
futures-util = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"

# URL parsing
url = "2"

[dev-dependencies]
pretty_assertions = "1"
