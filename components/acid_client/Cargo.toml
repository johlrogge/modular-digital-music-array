[package]
name = "acid-client"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "acid-client"

[dependencies]
acid-protocol = { workspace = true }
nng = "1.0"
nng-transport = { workspace = true }
serde_json = "1.0"

[features]
music = ["music-facts", "playback-primitives"]

[dependencies.music-facts]
package = "music-facts"
workspace = true
optional = true

[dev-dependencies]
pretty_assertions = "1"
acid-service = { workspace = true }

[dependencies.playback-primitives]
package = "playback-primitives"
workspace = true
optional = true
