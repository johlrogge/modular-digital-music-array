[package]
name = "library-search"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "library-search"

[dependencies]
date-expression = { workspace = true }
music-primitives = { workspace = true }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "1.0"
regex = "1"

[dev-dependencies]
rstest = "0.26"
serde_json = "1.0"
