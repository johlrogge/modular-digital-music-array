[package]
name = "library-ipc-protocol"
version = "0.10.1"
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/your-org/mdma"
license = "MIT"

[package.metadata]

[package.metadata.polylith]
interface = "library-ipc-protocol"

[dependencies]
library-search = { workspace = true }
music-facts = { workspace = true }
music-primitives = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
pretty_assertions = "1"
rstest = "0.26"
