[package]
name = "audio-hash"
version.workspace = true
edition = "2021"
authors = ["MDMA Development Team"]
repository = "https://github.com/johlrogge/modular-digital-music-array"
license = "MIT"

[package.metadata.polylith]
interface = "audio-hash"

[dependencies]
claxon = { workspace = true }
md-5 = { workspace = true }
music-primitives = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
proptest = { workspace = true }
rstest = { workspace = true }
# Second, independent decoder used only as a test oracle for PcmHash.
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "aiff", "pcm"] }
tempfile = { workspace = true }
